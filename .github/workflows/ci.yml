name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: url_shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d url_shortener"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/url_shortener?sslmode=disable

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l ./cmd ./internal)"

      - name: Apply migrations
        run: |
          psql "$DATABASE_URL" -f migrations/000001_create_urls_table.up.sql
          psql "$DATABASE_URL" -f migrations/000002_add_url_metadata_columns.up.sql

      - name: Run tests
        run: go test ./...

      - name: Build Docker image
        run: docker build -t url-shortener .

      - name: Validate Docker Compose file
        run: docker compose config

      - name: Build Docker Compose services
        run: docker compose build

      - name: Start Docker Compose database service
        env:
          DB_HOST_PORT: 5433
        run: docker compose up -d db

      - name: Show Docker Compose service status
        env:
          DB_HOST_PORT: 5433
        run: docker compose ps

      - name: Stop Docker Compose services
        if: always()
        env:
          DB_HOST_PORT: 5433
        run: docker compose down
